<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Classified phone poster</title><desc id="desc">A blue and gold poster showing a locked phone treated like a classified folder.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#123a95"/><stop offset="1" stop-color="#071126"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter></defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <g filter="url(#shadow)"><rect x="305" y="70" width="290" height="420" rx="42" fill="#050b1e" stroke="#ffbf2e" stroke-width="12"/><rect x="335" y="118" width="230" height="314" rx="24" fill="#101d42" stroke="#fff" stroke-width="4"/><circle cx="450" cy="462" r="16" fill="#fff" opacity=".85"/><path d="M402 260 V220 C402 188 427 166 450 166 C476 166 498 189 498 220 V260" fill="none" stroke="#ffbf2e" stroke-width="18" stroke-linecap="round"/><rect x="380" y="250" width="140" height="110" rx="20" fill="#ffbf2e"/><circle cx="450" cy="300" r="14" fill="#071126"/><path d="M450 312 V335" stroke="#071126" stroke-width="10" stroke-linecap="round"/></g>
  <text x="450" y="70" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="62" fill="#fff" stroke="#071126" stroke-width="8" paint-order="stroke">CLASSIFIED PHONE ENERGY</text>
  <text x="450" y="535" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" fill="#fff5c9">TRUST IS NOT A PASSWORD-PROTECTED SIDE QUEST</text>
</svg>
