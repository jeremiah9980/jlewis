<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Midnight scoreboard poster</title><desc id="desc">Blue and gold scoreboard showing the trust score and a 12:05 AM clock.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".42"/></filter><linearGradient id="g" x1="0" x2="1"><stop stop-color="#06112c"/><stop offset="1" stop-color="#123a95"/></linearGradient></defs>
  <rect width="900" height="560" fill="#0b1f4a"/><path d="M0 0 H900 V245 C720 190 600 290 450 235 C260 166 120 220 0 182Z" fill="#1f65ff" opacity=".6"/>
  <g filter="url(#s)"><rect x="70" y="72" width="760" height="390" rx="34" fill="url(#g)" stroke="#ffbf2e" stroke-width="14"/><text x="450" y="145" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" fill="#fff" stroke="#06112c" stroke-width="8" paint-order="stroke">MIDNIGHT SCOREBOARD</text><rect x="115" y="190" width="290" height="170" rx="20" fill="#071126" stroke="#fff" stroke-width="5"/><rect x="495" y="190" width="290" height="170" rx="20" fill="#071126" stroke="#fff" stroke-width="5"/><text x="260" y="242" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#ffbf2e">TRUST</text><text x="640" y="242" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#ffbf2e">TIMING</text><text x="260" y="330" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="88" fill="#fff">?</text><text x="640" y="330" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="72" fill="#fff">12:05</text><text x="450" y="420" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#fff5c9">OPTIONS BRO HAS ENTERED THE CHAT</text></g>
</svg>
